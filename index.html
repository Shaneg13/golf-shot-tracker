<!DOCTYPE html>
<html>
<head>
    <title>Golf Shot Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splashScreen">
    <img src="GolfShotTracker.png" alt="Golf Shot Tracker Loading Screen">

    <div class="loading-circle"></div>
</div>
<h1>Golf Shot Tracker</h1>
<div class="card" id="homeCard">

    <h2>Home</h2>
        <button onclick="goHome()">Home</button>
    <button onclick="showRoundSetup()">
        Start Round
    </button>

    <button onclick="continueRound()">
        Continue Round

    </button>

</div>
<div class="card" id="roundSetupCard">
    <h2>Round Setup</h2>

    <label>Course</label>
    <input id="courseInput" placeholder="Whitinsville GC">

    <label>Round Date</label>
    <input id="dateInput" type="date">

    <button onclick="saveRound()">Save Round</button>
</div>

<div class="card" id="shotTrackerCard">
<h2 id="roundTitle">No Round Started</h2>

<div class="hole-header">
    <h3>Current Hole: <span id="currentHole">1</span></h3>

    <button onclick="previousHole()">Previous Hole</button>
    <button onclick="nextHole()">Next Hole</button>
</div>

    <label>Club</label>
<select id="clubInput">
    <option value="Driver" data-loft="9°">Driver - 9°</option>
    <option value="3 Wood" data-loft="15°">3 Wood - 15°</option>
    <option value="3 Hybrid" data-loft="18°">3 Hybrid - 18°</option>
    <option value="5 Iron" data-loft="21°">5 Iron - 21°</option>
    <option value="6 Iron" data-loft="24°">6 Iron - 24°</option>
    <option value="7 Iron" data-loft="28°">7 Iron - 28°</option>
    <option value="8 Iron" data-loft="32°">8 Iron - 32°</option>
    <option value="9 Iron" data-loft="37°">9 Iron - 37°</option>
    <option value="PW" data-loft="43°">PW - 43°</option>
    <option value="AW" data-loft="49°">AW - 49°</option>
    <option value="56" data-loft="56°">56 - 56°</option>
    <option value="60" data-loft="60°">60 - 60°</option>
    <option value="Putter" data-loft="">Putter</option>
</select>

    <label>Distance</label>
    <input id="distanceInput" placeholder="154">
<label>Result</label>
<select id="resultInput">
    <option value="Good">Good</option>
    <option value="Left">Left</option>
    <option value="Right">Right</option>
    <option value="Short">Short</option>
    <option value="Long">Long</option>
    <option value="Green">Green</option>
    <option value="Fairway">Fairway</option>
    <option value="Penalty">Penalty</option>
</select>

<label>Lie</label>
<select id="lieInput">
    <option value="Tee">Tee</option>
    <option value="Fairway">Fairway</option>
    <option value="Rough">Rough</option>
    <option value="Sand">Sand</option>
    <option value="Recovery">Recovery</option>
    <option value="Green">Green</option>
</select>
<label>Par</label>
<input id="parInput" type="number" placeholder="4">
        <label>Hole Score</label>
        <input id="scoreInput" type="number" placeholder="5">
    <button onclick="saveShot()">Save Shot</button>
    <button onclick="showStats()">Show Stats</button>
    <button onclick="exportShots()">Export Data</button>
    <button onclick="clearShots()">Clear Shots</button>
    <button onclick="saveHole()">
    Save Hole Score
</button>


</div>

<div class="card" id="summaryCard">
    <h2>Round Summary</h2>
    <p>Course: <span id="summaryCourse">None</span></p>
    <p>Date: <span id="summaryDate">None</span></p>
    <p>Current Hole: <span id="summaryHole">1</span></p>
    <p>Shots Recorded: <span id="summaryShots">0</span></p>
</div>

<div class="card" id="scorecardCard">
    <h2>Scorecard</h2>

    <div id="scorecardList"></div>

    <h3>Round Totals</h3>
    <p>Total Par: <span id="totalPar">0</span></p>
    <p>Total Score: <span id="totalScore">0</span></p>
    <p>Round Status: <span id="roundStatus">E</span></p>
</div>

<div class="card" id="recentShotsCard">
    <h2>Recent Shots</h2>
    <div id="shotList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
