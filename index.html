<!DOCTYPE html>
<html>
<head>
    <title>Golf Shot Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Golf Shot Tracker</h1>

<div class="card">
    <h2>Round Setup</h2>

    <label>Course</label>
    <input id="courseInput" placeholder="Whitinsville GC">

    <label>Round Date</label>
    <input id="dateInput" type="date">

    <button onclick="saveRound()">Save Round</button>
</div>

<div class="card">
    <h2 id="roundTitle">No Round Started</h2>
    <h3>Current Hole: <span id="currentHole">1</span></h3>

    <label>Club</label>
    <input id="clubInput" placeholder="7 Iron">

    <label>Distance</label>
    <input id="distanceInput" placeholder="154">
<label>Result</label>
<select id="resultInput">
    <option value="Good">Good</option>
    <option value="Left">Left</option>
    <option value="Right">Right</option>
    <option value="Short">Short</option>
    <option value="Long">Long</option>
    <option value="Green">Green</option>
    <option value="Fairway">Fairway</option>
    <option value="Penalty">Penalty</option>
</select>

<label>Lie</label>
<select id="lieInput">
    <option value="Tee">Tee</option>
    <option value="Fairway">Fairway</option>
    <option value="Rough">Rough</option>
    <option value="Sand">Sand</option>
    <option value="Recovery">Recovery</option>
    <option value="Green">Green</option>
</select>
        <label>Hole Score</label>
        <input id="scoreInput" type="number" placeholder="5">
    <button onclick="saveShot()">Save Shot</button>
    <button onclick="nextHole()">Next Hole</button>
    <button onclick="showStats()">Show Stats</button>
    <button onclick="exportShots()">Export Data</button>
    <button onclick="clearShots()">Clear Shots</button>
    <button onclick="saveHole()">
    Save Hole Score
</button>


</div>

<div class="card">
    <h2>Round Summary</h2>
    <p>Course: <span id="summaryCourse">None</span></p>
    <p>Date: <span id="summaryDate">None</span></p>
    <p>Current Hole: <span id="summaryHole">1</span></p>
    <p>Shots Recorded: <span id="summaryShots">0</span></p>
</div>

<div class="card">
    <h2>Recent Shots</h2>
    <div id="shotList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
